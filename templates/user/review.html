{% extends "base.html" %}
{% block title %}Review Trek{% endblock %}

{% block content %}
<div class="main-content" style="max-width:700px;">

    <div class="page-header">
        <h2>
            <i class="bi bi-star-fill me-2" style="color:gold;"></i>
            Review Trek
        </h2>
    </div>

    <div class="card">
        <div class="card-body">

            <h4>{{ trek.name }}</h4>

            <p class="text-muted">
                {{ trek.location }}
            </p>

            <hr>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Rating
                    </label>

                    <select
                        class="form-select"
                        name="rating"
                        required>

                        <option value="">Choose Rating</option>

                        <option value="5"
                            {% if review and review.rating == 5 %}selected{% endif %}>
                            ★★★★★ (5)
                        </option>

                        <option value="4"
                            {% if review and review.rating == 4 %}selected{% endif %}>
                            ★★★★☆ (4)
                        </option>

                        <option value="3"
                            {% if review and review.rating == 3 %}selected{% endif %}>
                            ★★★☆☆ (3)
                        </option>

                        <option value="2"
                            {% if review and review.rating == 2 %}selected{% endif %}>
                            ★★☆☆☆ (2)
                        </option>

                        <option value="1"
                            {% if review and review.rating == 1 %}selected{% endif %}>
                            ★☆☆☆☆ (1)
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Review
                    </label>

                    <textarea
                        class="form-control"
                        rows="5"
                        name="comment"
                        placeholder="Tell us about your experience...">{{ review.comment if review else '' }}</textarea>

                </div>

                <button class="btn btn-forest">

                    <i class="bi {% if review %}bi-pencil-square{% else %}bi-star-fill{% endif %} me-1"></i>

                    {% if review %}
                        Update Review
                    {% else %}
                        Submit Review
                    {% endif %}

                </button>

            </form>

        </div>
    </div>

</div>
{% endblock %}
