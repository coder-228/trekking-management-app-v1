{% extends "base.html" %}
{% block title %}Edit My Profile{% endblock %}
{% block content %}
<div class="main-content" style="max-width:700px;">
    <div class="page-header">
        <h2><i class="bi bi-person-gear me-2" style="color:var(--sage)"></i>Edit My Profile</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="{{ url_for('staff.dashboard') }}" style="color:var(--moss);">Dashboard</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{{ url_for('staff.profile') }}" style="color:var(--moss);">My Profile</a></li>
                <li class="breadcrumb-item active">Edit</li>
            </ol>
        </nav>
    </div>
    <div class="card">
        <div class="card-body p-4">
            <form method="POST">
                <div class="row g-3">
                    <!-- Full Name -->
                    <div class="col-md-6">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" name="name" value="{{ staff.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" value="{{ staff.username }}" readonly>
                        <small style="color:var(--stone);font-size:0.78rem;">Username cannot be changed.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            value="{{ staff.email }}"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input
                            type="tel"
                            class="form-control"
                            name="phone"
                            value="{{ staff.phone or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Experience (Years)</label>
                        <input
                            type="number"
                            class="form-control"
                            name="experience_years"
                            min="0"
                            max="50"
                            value="{{ staff.experience_years }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">
                            New Password
                            <small style="color:var(--stone);">
                                (Leave blank to keep current password)
                            </small>
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="new_password"
                            minlength="6">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Specialization</label>
                        <input
                            type="text"
                            class="form-control"
                            name="specialization"
                            value="{{ staff.specialization or '' }}"
                            placeholder="e.g. High-altitude trekking, First Aid, Navigation">
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4 pt-3"
                     style="border-top:1px solid rgba(26,61,43,0.08);">
                    <button type="submit" class="btn btn-forest px-4">
                        <i class="bi bi-check-lg me-1"></i>
                        Save Changes</button>
                    <a href="{{ url_for('staff.profile') }}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
