{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5"
     style="background: linear-gradient(135deg, #0d1f17 0%, #1a3d2b 50%, #2d6a4f 100%);">

    <div class="col-11 col-sm-10 col-md-7 col-lg-5">
        <div class="text-center mb-4">
            <div style="width:64px;height:64px;background:rgba(82,183,136,0.2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                <i class="bi bi-person-plus-fill" style="font-size:1.8rem;color:#52b788"></i>
            </div>
            <h1 style="font-family:'Playfair Display',serif;color:white;font-size:2rem;font-weight:900;">Join SummitQuest</h1>
            <p style="color:rgba(183,228,199,0.6);font-size:0.9rem;">Start your trekking journey today</p>
        </div>

        <div class="card shadow-lg" style="border-radius:20px;">
            <div class="card-body p-4">
                <h5 style="font-family:'Playfair Display',serif;color:#1a3d2b;margin-bottom:1.5rem;">Create Trekker Account</h5>
                <form method="POST">
                    <!-- Register As -->
                    <div class="mb-4">
                        <label class="form-label">Register As</label>
                        <div class="d-flex gap-3">
                            <label class="flex-fill text-center" style="cursor:pointer;">
                                <input type="radio" name="role" value="user" class="d-none role-radio" checked>
                                <div class="role-btn p-3 rounded-3 border">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <i class="bi bi-person-fill fs-3"></i>
                                        <i class="bi bi-check-circle-fill check-icon"></i>
                                    </div>
                                    <strong class="d-block mt-2">Trekker</strong>
                                    <small>Book and participate in treks</small>
                                </div>
                            </label>

                            <label class="flex-fill text-center" style="cursor:pointer;">
                                <input type="radio"
                                    name="role"
                                    value="staff"
                                    class="d-none role-radio">

                                <div class="role-btn p-3 rounded-3 border">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <i class="bi bi-compass-fill fs-3"></i>
                                        <i class="bi bi-check-circle-fill check-icon"></i>
                                    </div>

                                    <strong class="d-block mt-2">Trek Staff</strong>
                                    <small>Guide and manage treks</small>
                                </div>
                            </label>

                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="name" class="form-control" placeholder="John Muir" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Username *</label>
                            <input type="text" name="username" class="form-control" placeholder="johnmuir" minlength="3" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" class="form-control" placeholder="25" min="10" max="100">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="Min 6 chars" minlength="6" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Confirm Password *</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-forest w-100 py-2 mt-4" style="border-radius:10px;">
                        <i class="bi bi-person-check me-2"></i>Create Account
                    </button>
                </form>
                <hr style="border-color:rgba(26,61,43,0.1);margin:1.5rem 0;">
                <p class="text-center mb-0" style="font-size:0.88rem;color:#6c757d;">
                    Already have an account? <a href="{{ url_for('auth.login') }}" style="color:#2d6a4f;font-weight:600;text-decoration:none;">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
<style>
.role-btn {
    border: 2px solid rgba(26,61,43,.15) !important;
    border-radius: 12px;
    transition: all 0.25s ease;
    color: #2d6a4f;
    background: white;
}

.role-btn:hover {
    background: rgba(82,183,136,.08);
    border-color: #52b788 !important;
    transform: translateY(-2px);
}

/* Selected card */
.role-radio:checked + .role-btn {
    background: #1a3d2b;
    color: white;
    border-color: #1a3d2b !important;
    box-shadow: 0 8px 20px rgba(26,61,43,.25);
    transform: scale(1.02);
}

.role-radio:checked + .role-btn small {
    color: rgba(255,255,255,.8);
}

.role-radio:checked + .role-btn .check-icon {
    opacity: 1;
    color: #52b788;
}

.check-icon {
    opacity: 0;
    transition: opacity .2s;
}
</style>
{% endblock %}
