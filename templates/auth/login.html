{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5"
     style="background: linear-gradient(135deg, #0d1f17 0%, #1a3d2b 50%, #2d6a4f 100%);">

    <div class="col-11 col-sm-8 col-md-5 col-lg-4 col-xl-3">
        <div class="text-center mb-4">
            <div style="width:64px;height:64px;background:rgba(82,183,136,0.2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                <i class="bi bi-triangle-fill" style="font-size:1.8rem;color:#52b788"></i>
            </div>
            <h1 style="font-family:'Playfair Display',serif;color:white;font-size:2rem;font-weight:900;">SummitQuest</h1>
            <p style="color:rgba(183,228,199,0.6);font-size:0.9rem;">Sign in to continue your adventure</p>
        </div>

        <div class="card shadow-lg" style="border-radius:20px;overflow:hidden;">
            <div class="card-body p-4">
                <h5 style="font-family:'Playfair Display',serif;color:#1a3d2b;margin-bottom:1.5rem;">Welcome back</h5>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username / Email</label>
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius:10px 0 0 10px;border:1.5px solid rgba(26,61,43,0.15);border-right:none;background:rgba(82,183,136,0.05);">
                                <i class="bi bi-person" style="color:#2d6a4f"></i>
                            </span>
                            <input type="text" name="username" class="form-control" style="border-radius:0 10px 10px 0;border-left:none;" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text" style="border-radius:10px 0 0 10px;border:1.5px solid rgba(26,61,43,0.15);border-right:none;background:rgba(82,183,136,0.05);">
                                <i class="bi bi-lock" style="color:#2d6a4f"></i>
                            </span>
                            <input type="password" name="password" class="form-control" style="border-radius:0 10px 10px 0;border-left:none;" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-forest w-100 py-2" style="border-radius:10px;font-size:0.95rem;">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>

                <hr style="border-color:rgba(26,61,43,0.1);margin:1.5rem 0;">
                <p class="text-center mb-0" style="font-size:0.88rem;color:#6c757d;">
                    New trekker? <a href="{{ url_for('auth.register') }}" style="color:#2d6a4f;font-weight:600;text-decoration:none;">Create account</a>
                </p>
            </div>
        </div>

        <div class="text-center mt-3">
            <small style="color:rgba(183,228,199,0.4);">Admin: admin / admin123</small>
        </div>
    </div>
</div>
{% endblock %}
